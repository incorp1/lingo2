<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Демо: анимации кнопок «Произношение» и «Информация о слове»</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --ink: #1c1f24; --ink-subtle: #6b7280;
    --border: #e3e6ea; --accent: #3b6cf6; --accent-rgb: 59, 108, 246;
    --btn-bg: #eef2fe;
  }
  [data-theme="dark"] {
    --bg: #121418; --card: #1c1f25; --ink: #eef0f3; --ink-subtle: #9aa1ac;
    --border: #2c3038; --accent: #7b9bff; --accent-rgb: 123, 155, 255;
    --btn-bg: #262c3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 19px; margin: 4px 0 6px; }
  .lead { color: var(--ink-subtle); font-size: 13px; margin: 0 0 14px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; position: sticky; top: 0; padding: 8px 0; background: var(--bg); z-index: 5; }
  .toolbar button, .toolbar label {
    font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--ink);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .toolbar .primary { background: var(--accent); color: #fff; border-color: transparent; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .variant { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
  .variant h2 { font-size: 15px; margin: 0 0 2px; }
  .variant p { font-size: 12.5px; color: var(--ink-subtle); margin: 0 0 12px; }
  .badge { font-size: 11px; background: var(--accent); color: #fff; padding: 2px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 2px; }

  /* Макет учебной карточки */
  .card {
    border: 1px solid var(--border); border-radius: 14px; padding: 18px 14px 14px;
    text-align: center; background: var(--bg);
  }
  .word { font-size: 24px; font-weight: 700; }
  .ts { color: var(--ink-subtle); font-size: 14px; margin: 2px 0 14px; }
  .actions { display: flex; justify-content: center; gap: 18px; }
  .next { margin-top: 12px; font: inherit; font-size: 12px; background: none; border: 0; color: var(--accent); cursor: pointer; }

  .hint-btn {
    position: relative; width: 48px; height: 48px; border-radius: 50%;
    border: 0; background: var(--btn-bg); color: var(--accent);
    display: grid; place-items: center; cursor: pointer; padding: 0;
    transition: transform 180ms cubic-bezier(.34, 1.56, .64, 1);
    overflow: visible;
  }
  .hint-btn svg { width: 24px; height: 24px; display: block; }
  /* Отклик на тап — общий для всех вариантов */
  .hint-btn:active { transform: scale(.94); transition-duration: 80ms; }
  .hint-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ===== A. Кольцо «дыхание» ===== */
  .v-a .hint-btn::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(var(--accent-rgb), .45);
    pointer-events: none; opacity: 0;
  }
  .v-a.play .hint-btn::after { animation: ring 1.5s cubic-bezier(.25, 1, .5, 1) 2; }
  .v-a.play .hint-btn:nth-child(2)::after { animation-delay: .2s; }
  @keyframes ring {
    0%   { opacity: 1; box-shadow: 0 0 0 0 rgba(var(--accent-rgb), .45); }
    100% { opacity: 0; box-shadow: 0 0 0 12px rgba(var(--accent-rgb), 0); }
  }

  /* ===== B. Смысловые микро-анимации ===== */
  .v-b .wave { opacity: 1; transform-origin: 9px 12px; }
  .v-b.play .wave1 { animation: wave 0.7s ease-in-out 3; }
  .v-b.play .wave2 { animation: wave 0.7s ease-in-out .12s 3; }
  @keyframes wave { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .25; transform: scale(.85); } }
  .v-b.play .i-icon { animation: nudge .9s cubic-bezier(.36,.07,.19,.97) .5s 1; transform-origin: 50% 50%; }
  @keyframes nudge {
    0%,100% { transform: rotate(0); } 20% { transform: rotate(-14deg); }
    40% { transform: rotate(10deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(3deg); }
  }

  /* ===== C. Мягкий подскок ===== */
  .v-c.play .hint-btn { animation: hop .7s cubic-bezier(.28,.84,.42,1) 1; }
  .v-c.play .hint-btn:nth-child(2) { animation-delay: .15s; }
  @keyframes hop {
    0%,100% { transform: translateY(0); } 30% { transform: translateY(-4px); }
    55% { transform: translateY(0); } 72% { transform: translateY(-1.5px); }
  }

  /* ===== D. Бегущий блик ===== */
  .v-d .hint-btn { overflow: hidden; }
  .v-d .hint-btn::before {
    content: ""; position: absolute; top: -20%; bottom: -20%; width: 45%;
    left: -70%; transform: skewX(-20deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent);
    pointer-events: none;
  }
  [data-theme="dark"] .v-d .hint-btn::before { background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent); }
  .v-d.play .hint-btn::before { animation: shine 1.1s ease-in-out 1; }
  .v-d.play .hint-btn:nth-child(2)::before { animation-delay: .25s; }
  @keyframes shine { to { left: 130%; } }

  /* ===== E. Состояние во время действия ===== */
  .v-e .hint-btn.is-playing .wave1 { animation: wave .7s ease-in-out infinite; }
  .v-e .hint-btn.is-playing .wave2 { animation: wave .7s ease-in-out .12s infinite; }
  .v-e .hint-btn.is-playing { background: rgba(var(--accent-rgb), .2); }
  .v-e .spinner {
    position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid transparent; border-top-color: var(--accent);
    opacity: 0; pointer-events: none;
  }
  .v-e .hint-btn.is-loading .spinner { opacity: 1; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 12px; color: var(--ink-subtle); margin-top: 10px; min-height: 18px; }

  /* ===== A + E (рекомендация) ===== */
  .v-ae .hint-btn::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(var(--accent-rgb), .45); pointer-events: none; opacity: 0;
  }
  .v-ae.play .hint-btn:not(.tapped)::after { animation: ring 1.5s cubic-bezier(.25, 1, .5, 1) 2; }
  .v-ae.play .hint-btn:nth-child(2)::after { animation-delay: .2s; }
  .v-ae .hint-btn.is-playing .wave1 { animation: wave .7s ease-in-out infinite; }
  .v-ae .hint-btn.is-playing .wave2 { animation: wave .7s ease-in-out .12s infinite; }
  .v-ae .hint-btn.is-playing { background: rgba(var(--accent-rgb), .2); }
  .v-ae .spinner { position: absolute; inset: -3px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--accent); opacity: 0; pointer-events: none; }
  .v-ae .hint-btn.is-loading .spinner { opacity: 1; animation: spin .8s linear infinite; }

  /* Уменьшение движения: системная настройка или переключатель на странице */
  @media (prefers-reduced-motion: reduce) { body:not(.force-motion) { --rm: 1; } }
  body.reduce-motion .play .hint-btn,
  body.reduce-motion .play .hint-btn *,
  body.reduce-motion .play .hint-btn::before,
  body.reduce-motion .play .hint-btn::after { animation: none !important; }
  body.reduce-motion .play .hint-btn { box-shadow: 0 0 0 2px rgba(var(--accent-rgb), .45); transition: box-shadow .4s; }
</style>
</head>
<body>
<h1>Анимации кнопок-подсказок</h1>
<p class="lead">Каждый вариант проигрывается при «появлении карточки». Нажмите «Повторить все» или «Следующая карточка» внутри варианта. Кнопки можно нажимать, чтобы почувствовать отклик на тап.</p>

<div class="toolbar">
  <button class="primary" id="replay">▶ Повторить все</button>
  <button id="theme">🌓 Тема</button>
  <label><input type="checkbox" id="rm"> Уменьшение движения</label>
</div>

<div class="grid" id="grid"></div>

<template id="card-tpl">
  <div class="card">
    <div class="word">serendipity</div>
    <div class="ts">[ˌserənˈdɪpəti]</div>
    <div class="actions">
      <button class="hint-btn" data-kind="audio" aria-label="Произношение">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/>
          <path class="wave wave1" d="M16 9.5a3.5 3.5 0 0 1 0 5"/>
          <path class="wave wave2" d="M18.5 7a7 7 0 0 1 0 10"/>
        </svg>
        <span class="spinner"></span>
      </button>
      <button class="hint-btn" data-kind="info" aria-label="Информация о слове">
        <svg class="i-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/>
        </svg>
        <span class="spinner"></span>
      </button>
    </div>
    <button class="next">↻ Следующая карточка</button>
  </div>
  <div class="status"></div>
</template>

<script>
  var variants = [
    { cls: "v-a", title: "A. Кольцо «дыхание»", desc: "Кольцо акцентного цвета дважды мягко расходится и гаснет. Кнопка не двигается." },
    { cls: "v-b", title: "B. Смысловые микро-анимации", desc: "Волны динамика пульсируют, «i» слегка покачивается. Анимация подсказывает, что сделает кнопка." },
    { cls: "v-c", title: "C. Мягкий подскок", desc: "Кнопки по очереди подпрыгивают на несколько пикселей с пружинным затуханием." },
    { cls: "v-d", title: "D. Бегущий блик", desc: "По кнопке один раз проходит светлая полоса, как по стеклу." },
    { cls: "v-e", title: "E. Состояние во время действия", desc: "Сама по себе не зовёт к тапу: нажмите кнопки. Волны звучат во время произношения, кольцо-индикатор показывает загрузку.", tap: true },
    { cls: "v-ae", title: "A + E. Рекомендация", desc: "Кольцо при появлении карточки плюс живое состояние при нажатии. После первого тапа кольцо у кнопки больше не показывается.", tap: true, rec: true }
  ];

  var grid = document.getElementById("grid");
  var tpl = document.getElementById("card-tpl");

  variants.forEach(function (v) {
    var box = document.createElement("section");
    box.className = "variant " + v.cls;
    box.innerHTML = "<h2>" + v.title + (v.rec ? '<span class="badge">рекомендую</span>' : "") + "</h2><p>" + v.desc + "</p>";
    box.appendChild(tpl.content.cloneNode(true));
    grid.appendChild(box);

    box.querySelector(".next").addEventListener("click", function () { play(box); });
    var status = box.querySelector(".status");

    box.querySelectorAll(".hint-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        btn.classList.add("tapped");
        if (!v.tap) { status.textContent = btn.dataset.kind === "audio" ? "🔊 Произношение" : "ℹ️ Информация о слове"; return; }
        if (btn.dataset.kind === "audio") {
          btn.classList.add("is-playing"); status.textContent = "🔊 Звучит произношение…";
          setTimeout(function () { btn.classList.remove("is-playing"); status.textContent = ""; }, 1800);
        } else {
          btn.classList.add("is-loading"); status.textContent = "Загружаем сведения о слове…";
          setTimeout(function () { btn.classList.remove("is-loading"); status.textContent = "ℹ️ Сведения открыты"; }, 1200);
        }
      });
    });
  });

  function play(box) {
    box.classList.remove("play");
    void box.offsetWidth; // перезапуск CSS-анимации
    box.classList.add("play");
  }
  function playAll() { document.querySelectorAll(".variant").forEach(play); }

  document.getElementById("replay").addEventListener("click", playAll);
  document.getElementById("theme").addEventListener("click", function () {
    var r = document.documentElement;
    r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
  });
  var rm = document.getElementById("rm");
  rm.checked = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function applyRm() { document.body.classList.toggle("reduce-motion", rm.checked); playAll(); }
  rm.addEventListener("change", applyRm);
  if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
  applyRm();
</script>
</body>
</html>
